data:
  tokenizer: null
  train_files: ~/data/rlhf/gsm8k/train.parquet
  val_files: ~/data/rlhf/gsm8k/test.parquet
  train_data_num: null
  val_data_num: null
  prompt_key: prompt
  max_prompt_length: 32768
  max_response_length: 2048
  max_start_length: 32768
  max_obs_length: 4096
  train_batch_size: 1024
  val_batch_size: 1312
  return_raw_input_ids: False  # This should be set to true when the tokenizer between policy and rm differs
  return_raw_chat: False
  shuffle_train_dataloader: True

actor_rollout_ref:
  hybrid_engine: True
  model:
    path: ~/models/deepseek-llm-7b-chat
    external_lib: null
    override_config: { }
    enable_gradient_checkpointing: False
    enable_activation_offload: False
    use_remove_padding: False
  actor:
    strategy: fsdp  # This is for backward-compatibility
    policy_loss: grpo
    ppo_mini_batch_size: 256
    ppo_micro_batch_size: 64
    ppo_mini_batch_size_fixed: null
    ppo_micro_batch_size_fixed: null
    use_dynamic_bsz: False
    ppo_max_token_len_per_gpu: 16384 # n * ${data.max_prompt_length} + ${data.max_response_length}
    grad_clip: 1.0
    state_masking: False
    clip_ratio: 0.2
    clip_ratio_low: 0.2
    clip_ratio_high: 0.2
    clip_ratio_c: 3.0
    loss_agg_mode: token-mean
    entropy_coeff: 0.0
    entropy_from_logits_with_chunking: False
    entropy_from_logits_chunk_size: 2048
    entropy_checkpointing: False
    use_kl_loss: False # True for GRPO
    kl_loss_coef: 0.001 # for grpo
    kl_loss_type: low_var_kl # for grpo
    ppo_epochs: 1
    shuffle: False
    ulysses_sequence_parallel_size: 1 # sp size
    optim:
      lr: 1e-6
      lr_warmup_steps_ratio: 0.  # the total steps will be injected during runtime
      min_lr_ratio: null   # only useful for warmup with cosine
      warmup_style: constant  # select from constant/cosine
      total_training_steps: -1  # must be override by program
    fsdp_config:
      wrap_policy:
        # transformer_layer_cls_to_wrap: None
        min_num_params: 0
      param_offload: False
      grad_offload: False
      optimizer_offload: False
      fsdp_size: -1
  ref:
    fsdp_config:
      param_offload: False
      wrap_policy:
        # transformer_layer_cls_to_wrap: None
        min_num_params: 0
      fsdp_size: -1
    log_prob_micro_batch_size: 128
    log_prob_use_dynamic_bsz: ${actor_rollout_ref.actor.use_dynamic_bsz}
    log_prob_max_token_len_per_gpu: ${actor_rollout_ref.actor.ppo_max_token_len_per_gpu}
    ulysses_sequence_parallel_size: ${actor_rollout_ref.actor.ulysses_sequence_parallel_size} # sp size
    # ref never backprops, so entropy_checkpointing (a backward-pass memory trick) wouldn't help
    # it -- but its forward pass hits the same huge-vocab lm_head softmax as the actor's, so it
    # shares the actor's chunking setting to avoid that OOM too.
    entropy_from_logits_with_chunking: ${actor_rollout_ref.actor.entropy_from_logits_with_chunking}
    entropy_from_logits_chunk_size: ${actor_rollout_ref.actor.entropy_from_logits_chunk_size}
  rollout:
    name: vllm
    temperature: 1.0
    top_k: -1 # 0 for hf rollout, -1 for vllm rollout
    top_p: 0.95
    prompt_length: ${data.max_prompt_length}  # not use for opensource
    response_length: ${data.max_response_length}
    # for vllm rollout
    dtype: bfloat16 # should align with FSDP
    gpu_memory_utilization: 0.5
    # "raw_logprobs" (vLLM's own default) reports infer_log_probs from the pre-temperature/
    # pre-top_k/top_p logits; "processed_logprobs" reports them from the post-filtering
    # (renormalized) distribution actually sampled from -- see vllm_rollout_spmd_ts.py. Only
    # affects TreeNode.log_prob/normalized_log_prob (get_expand_node's 'prob'/'atpo' node
    # selection), never PPO's old_log_prob.
    logprobs_mode: raw_logprobs
    ignore_eos: False
    enforce_eager: True
    free_cache_engine: True
    load_format: dummy_dtensor
    tensor_model_parallel_size: 2
    max_num_batched_tokens: 8192
    max_num_seqs: 1024
    log_prob_micro_batch_size: 128
    log_prob_use_dynamic_bsz: ${actor_rollout_ref.actor.use_dynamic_bsz}
    log_prob_max_token_len_per_gpu: ${actor_rollout_ref.actor.ppo_max_token_len_per_gpu}
    # for hf rollout
    do_sample: True
    # number of responses (i.e. num sample times)
    n: 1 # > 1 for grpo
    n_agent: 1 # different here used for agent tasks only
    tree_search: False
    ts_n: 1
    ts_m: 1
    ts_l: 1
    ts_n_s1: 1
    ts_m_s1: 1
    ts_l_s1: 1
    ts_k_s1: 1
    ts_n_s2: 1
    ts_m_s2: 1
    ts_l_s2: 1
    ts_k_s2: 1
    reward_mode: tree
    expand_mode: random

critic:
  strategy: fsdp
  optim:
    lr: 1e-5
    lr_warmup_steps_ratio: 0.  # the total steps will be injected during runtime
    min_lr_ratio: null   # only useful for warmup with cosine
    warmup_style: constant  # select from constant/cosine
    total_training_steps: -1  # must be override by program
  model:
    path: ~/models/deepseek-llm-7b-chat
    tokenizer_path: ${actor_rollout_ref.model.path}
    override_config: { }
    external_lib: ${actor_rollout_ref.model.external_lib}
    enable_gradient_checkpointing: False
    use_remove_padding: False
    fsdp_config:
      param_offload: False
      grad_offload: False
      optimizer_offload: False
      wrap_policy:
        # transformer_layer_cls_to_wrap: None
        min_num_params: 0
      fsdp_size: -1
  ppo_mini_batch_size: ${actor_rollout_ref.actor.ppo_mini_batch_size}
  ppo_micro_batch_size: 64
  forward_micro_batch_size: ${critic.ppo_micro_batch_size}
  use_dynamic_bsz: ${actor_rollout_ref.actor.use_dynamic_bsz}
  ppo_max_token_len_per_gpu: 32768 # (${actor_rollout_ref.actor.ppo_max_token_len_per_gpu}) * 2
  forward_max_token_len_per_gpu: ${critic.ppo_max_token_len_per_gpu}
  ulysses_sequence_parallel_size: 1 # sp size
  ppo_epochs: ${actor_rollout_ref.actor.ppo_epochs}
  shuffle: ${actor_rollout_ref.actor.shuffle}
  grad_clip: 1.0
  cliprange_value: 0.5

reward_model:
  enable: False
  strategy: fsdp
  model:
    input_tokenizer: ${actor_rollout_ref.model.path}  # set this to null if the chat template is identical
    path: ~/models/FsfairX-LLaMA3-RM-v0.1
    external_lib: ${actor_rollout_ref.model.external_lib}
    use_remove_padding: False
    fsdp_config:
      min_num_params: 0
      param_offload: False
  micro_batch_size: 64
  max_length: null
  ulysses_sequence_parallel_size: 1 # sp size
  use_dynamic_bsz: ${critic.use_dynamic_bsz}
  forward_max_token_len_per_gpu: ${critic.forward_max_token_len_per_gpu}
db_env:
  url: "http://127.0.0.1:6002"

algorithm:
  gamma: 1.0
  lam: 1.0
  adv_estimator: gae
  adv_estimator_s2: gae
  no_think_rl: False
  kl_penalty: kl  # how to estimate kl divergence
  use_kl_in_reward: False
  kl_fix: none
  kl_ctrl:
    type: fixed
    kl_coef: 0.001
  state_masking:
    start_state_marker: "<information>"
    end_state_marker: "</information>"

trainer:
  total_epochs: 30
  total_training_steps: null
  stage1_training_steps: ${trainer.total_training_steps}
  project_name: verl_examples
  experiment_name: gsm8k
  logger: [ 'console', 'wandb' ]
  nnodes: 1
  n_gpus_per_node: 8
  save_freq: -1
  test_freq: -1
  # Run the validation set this many times and average the resulting metrics (val/test_score,
  # val/pass_rate, val/no_submission_rate, val/invalid_submission_rate, val/avg_turns_success).
  # Greedy (temperature=0) decoding over a long multi-turn agent rollout is not bit-for-bit
  # deterministic run to run (vLLM's continuous batching means the floating-point reduction
  # order in attention/matmul kernels depends on concurrent batch composition, which can tip a
  # near-tied token decision one way or the other and compound over many turns) -- repeating and
  # averaging smooths that out. 1 keeps the old single-pass behavior.
  val_repeat: 1
  critic_warmup: 0
  default_hdfs_dir: ~/experiments/gsm8k/ppo/${trainer.experiment_name}
  default_local_dir: checkpoints/${trainer.project_name}/${trainer.experiment_name}

max_turns: 16